<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>登录 · Infinite Canvas</title>
<style>
  html,body{margin:0;height:100%;background:#fafafa;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",PingFang SC,sans-serif;color:#1a1a1a;}
  .wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .card{width:100%;max-width:380px;background:#fff;border:1px solid #e6e6e6;border-radius:16px;padding:32px 28px;box-shadow:0 8px 32px rgba(0,0,0,0.04);}
  h1{margin:0 0 6px;font-size:22px;font-weight:700;}
  .sub{margin:0 0 24px;color:#888;font-size:13px;}
  .field{display:block;margin-bottom:14px;}
  .field label{display:block;font-size:12px;color:#666;margin-bottom:6px;font-weight:600;letter-spacing:0.02em;}
  .field input{box-sizing:border-box;width:100%;height:40px;padding:0 12px;border:1px solid #ddd;border-radius:8px;background:transparent;color:inherit;font-size:14px;outline:none;}
  .field input:focus{border-color:#222;}
  .btn{display:block;width:100%;height:42px;background:#111;color:#fff;border:0;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;margin-top:8px;}
  .btn:hover{background:#000;}
  .btn:disabled{opacity:0.5;cursor:not-allowed;}
  .err{color:#d33;font-size:13px;margin-top:10px;min-height:18px;}
  .hint{margin-top:18px;font-size:12px;color:#999;text-align:center;}
  .hint code{background:rgba(0,0,0,0.05);padding:1px 6px;border-radius:4px;font-family:ui-monospace,monospace;}
</style>
</head>
<body>
<div class="wrap">
  <form class="card" id="loginForm">
    <h1 id="title">登录</h1>
    <p class="sub" id="sub">输入账号与密码继续</p>
    <div class="field">
      <label for="username">用户名</label>
      <input id="username" name="username" autocomplete="username" required>
    </div>
    <div class="field">
      <label for="password">密码</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
    </div>
    <div class="field" id="newPasswordField" style="display:none">
      <label for="newPassword">新密码（至少 6 位）</label>
      <input id="newPassword" name="newPassword" type="password" autocomplete="new-password" minlength="6">
    </div>
    <button class="btn" type="submit" id="submitBtn">登录</button>
    <div class="err" id="err"></div>
    <div class="hint">首次启动默认 <code>admin</code> / <code>admin123</code>，登录后请修改密码</div>
  </form>
</div>
<script>
const form = document.getElementById('loginForm');
const errEl = document.getElementById('err');
const submitBtn = document.getElementById('submitBtn');
const newPwField = document.getElementById('newPasswordField');
const titleEl = document.getElementById('title');
const subEl = document.getElementById('sub');
let mustChangeMode = false;
let cachedCreds = null;

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errEl.textContent = '';
  submitBtn.disabled = true;
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  try {
    if (mustChangeMode) {
      const newPassword = document.getElementById('newPassword').value;
      if (!newPassword || newPassword.length < 6) {
        errEl.textContent = '新密码至少 6 位';
        submitBtn.disabled = false;
        return;
      }
      const r = await fetch('/api/auth/change-password', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({old_password: cachedCreds.password, new_password: newPassword}),
      });
      if (!r.ok) {
        errEl.textContent = (await r.json().catch(()=>({}))).detail || '修改密码失败';
        submitBtn.disabled = false;
        return;
      }
      location.replace('/?_t=' + Date.now());
      return;
    }
    const r = await fetch('/api/auth/login', {
      method: 'POST',
      credentials: 'include',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({username, password}),
    });
    if (!r.ok) {
      errEl.textContent = (await r.json().catch(()=>({}))).detail || '登录失败';
      submitBtn.disabled = false;
      return;
    }
    const data = await r.json();
    if (data.must_change_password) {
      mustChangeMode = true;
      cachedCreds = {username, password};
      titleEl.textContent = '首次登录，请设置新密码';
      subEl.textContent = '安全考虑，请修改默认密码';
      document.getElementById('username').disabled = true;
      document.getElementById('password').disabled = true;
      newPwField.style.display = 'block';
      document.getElementById('newPassword').focus();
      submitBtn.textContent = '保存新密码并进入';
      submitBtn.disabled = false;
      return;
    }
    // 再做一次 me 校验确认 cookie 真的写进去了，避免直接跳 / 又被打回登录页
    const meR = await fetch('/api/auth/me', {credentials: 'include', cache: 'no-store'});
    const me = await meR.json().catch(() => ({}));
    if (!me.authenticated) {
      errEl.textContent = '登录成功但浏览器未保存 cookie，请检查浏览器隐私设置 / 第三方 cookie 拦截';
      submitBtn.disabled = false;
      return;
    }
    location.replace('/?_t=' + Date.now());
  } catch (e) {
    errEl.textContent = '网络错误：' + (e.message || e);
    submitBtn.disabled = false;
  }
});
</script>
</body>
</html>
